[package]
name = "tcp_source"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = { version = "52.0.0", features = ["json"] }
clap = { version = "4.5.7", features = ["derive"] }
csv = "1.3.0"
tokio = { version = "1.38.0", features = ["full"] }
tokio-util = "0.7.11"
chrono = "0.4.38"
serde = { version = "1.0.204", features = ["derive"] }
regex = "1.10.5"
humantime = "2.1.0"
crossbeam-queue = "0.3.11"
async-channel = "2.3.1"
itertools = "0.13.0"
