syntax = "proto3";

package bid_event;

import "google/protobuf/timestamp.proto";

// Corresponds to the Flink table `bid_events`
message BidEvent {
    int64 auction   = 1;
    int64 bidder    = 2;
    int64 price     = 3;
    string channel  = 4;
    string url      = 5;
    // Flink TIMESTAMP(3) → Protobuf Timestamp (seconds + nanos)
    google.protobuf.Timestamp dateTime = 6;
    string extra    = 7;
}
